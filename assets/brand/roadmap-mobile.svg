<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1030" viewBox="0 0 600 1030" role="img" aria-labelledby="title description">
<title id="title">MT2 Mod Framework roadmap</title>
<desc id="description">Available now: Start creating. Lua mods and C++ plugins; Lua reload and mod apps; Static GLB scenery. Next priorities: Reach more of MT2. More game operations; Native UI and diagnostics; Better content workflows. Longer term: More ways to create. Animated models; C# mod support; Broader multiplayer APIs</desc>
