name: Publish documentation
on:
  push:
    branches: [main]
    paths: &docs-inputs
      - 'docs/**'
      - '*.md'
      - 'assets/**'
      - 'api/**'
      - 'include/mt2fw/plugin.h'
      - 'sdk/**'
      - 'examples/**'
      - 'LICENSE'
      - 'licenses/**'
      - 'tools/build_docs.py'
      - 'tools/check_docs.py'
      - 'tools/generate_docs.py'
      - 'tools/license_inventory.py'
      - 'tools/render_roadmap.py'
      - 'tools/mt2fw/**'
      - 'tests/docs-browser.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-dev.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *docs-inputs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python tools/render_roadmap.py --check
      - run: npm run docs:build
      - run: python tools/check_docs.py
      - run: npx playwright install chromium
      - run: npm run docs:test
      - name: Add Nexus artwork
        if: github.event_name != 'pull_request'
        run: Copy-Item -LiteralPath assets/nexus -Destination dist/docs/offline/nexus -Recurse
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/offline
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
