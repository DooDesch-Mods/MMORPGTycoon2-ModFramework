name: Build and verify framework
on:
  push:
    branches: ['**'] # Tags build through release.yml.
    # Every ignored path is in the paths list of docs.yml, so no change goes unchecked.
    paths-ignore: ['docs/**', '*.md', 'assets/**', '.github/workflows/docs.yml']
  pull_request:
    paths-ignore: ['docs/**', '*.md', 'assets/**', '.github/workflows/docs.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    env:
      # Pull requests check the docs in docs.yml; other events build them for the packages.
      PACKAGE: ${{ github.event_name != 'pull_request' }}
      SCCACHE_DIR: ${{ github.workspace }}\.ci-cache\sccache
      # One compiler cache per main commit; pull requests and branch pushes only read main's newest.
      # Manual runs also write, so a branch can prove its warm build.
      SAVE_COMPILER_CACHE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/sccache
          key: sccache-v1-windows-x64-msvc-${{ github.sha }}
          restore-keys: sccache-v1-windows-x64-msvc-
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      - name: Build and check with Ninja and sccache
        env:
          CMAKE_GENERATOR: Ninja Multi-Config
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:CMAKE_BUILD_PARALLEL_LEVEL = $env:NUMBER_OF_PROCESSORS
          sccache --zero-stats
          python tools/build.py --check
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && env.SAVE_COMPILER_CACHE == 'true' && steps.compiler_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/sccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - if: env.PACKAGE == 'true'
        run: npm ci --ignore-scripts
      - if: env.PACKAGE == 'true'
        run: python tools/license_inventory.py
      - if: env.PACKAGE == 'true'
        run: npm run docs:build
      - if: env.PACKAGE == 'true'
        run: python tools/check_docs.py
      - if: env.PACKAGE == 'true'
        run: npx playwright install chromium
      - if: env.PACKAGE == 'true'
        run: npm run docs:test
      - name: Build portable helper and CLI
        if: env.PACKAGE == 'true'
        run: python tools/build_helper.py --bootstrap
      - name: Package player runtime and developer SDK
        if: env.PACKAGE == 'true'
        run: build/helper-env/Scripts/python.exe tools/package_product.py
      - name: Package Nexus and Vortex downloads
        if: env.PACKAGE == 'true'
        run: |
          python tools/package_nexus.py
          python tools/package_vortex.py
      - name: Retain build packages
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MT2-ModFramework-windows-x64-${{ github.sha }}
          path: |
            dist/nexus/*.zip
            dist/sdk/*.zip
            dist/vortex/*.zip
            dist/docs/offline/**
          if-no-files-found: error
          retention-days: 30
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-build-evidence-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
