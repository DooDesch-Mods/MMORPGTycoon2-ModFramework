name: Build and verify framework
on:
  push:
    branches: ['**'] # Tags build through release.yml.
    # Every ignored path is in the paths list of docs.yml, so no change goes unchecked.
    paths-ignore: ['docs/**', '*.md', 'assets/**', '.github/workflows/docs.yml']
  pull_request:
    paths-ignore: ['docs/**', '*.md', 'assets/**', '.github/workflows/docs.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    env:
      # Pull requests check the docs in docs.yml; other events build them for the packages.
      PACKAGE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build.py --check
      - if: env.PACKAGE == 'true'
        run: npm ci --ignore-scripts
      - if: env.PACKAGE == 'true'
        run: python tools/license_inventory.py
      - if: env.PACKAGE == 'true'
        run: npm run docs:build
      - if: env.PACKAGE == 'true'
        run: python tools/check_docs.py
      - if: env.PACKAGE == 'true'
        run: npx playwright install chromium
      - if: env.PACKAGE == 'true'
        run: npm run docs:test
      - name: Build portable helper and CLI
        if: env.PACKAGE == 'true'
        run: python tools/build_helper.py --bootstrap
      - name: Package player runtime and developer SDK
        if: env.PACKAGE == 'true'
        run: build/helper-env/Scripts/python.exe tools/package_product.py
      - name: Package Nexus and Vortex downloads
        if: env.PACKAGE == 'true'
        run: |
          python tools/package_nexus.py
          python tools/package_vortex.py
      - name: Retain build packages
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MT2-ModFramework-windows-x64-${{ github.sha }}
          path: |
            dist/nexus/*.zip
            dist/sdk/*.zip
            dist/vortex/*.zip
            dist/docs/offline/**
          if-no-files-found: error
          retention-days: 30
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-build-evidence-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
